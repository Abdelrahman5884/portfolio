<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Achievements — Abdelrahman</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
:root{--bg:#041428;--accent:#34d399;--text:#e6eef3}
body{margin:0;font-family:'Poppins',sans-serif;background:linear-gradient(180deg,var(--bg),#072033);color:var(--text)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 5%;border-bottom:1px solid rgba(255,255,255,0.03);position:sticky;top:0;background:rgba(255,255,255,0.01);z-index:10}
.header-left{display:flex;gap:12px;align-items:center}
.header-left img{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,0.03)}
.wrap{max-width:940px;margin:36px auto;padding:0 5%}
.card{background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));padding:18px;border-radius:12px;border:1px solid rgba(255,255,255,0.02);box-shadow:0 18px 40px rgba(0,0,0,0.6)}
.cert-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}
.cert-img{width:360px;max-width:92%;border-radius:8px;border:6px solid rgba(56,189,248,0.06);box-shadow:0 18px 40px rgba(2,6,23,0.6);transition:transform .28s}
.cert-img:hover{transform:scale(1.03) rotate(-1deg)}
.meta{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px}
.meta a{background:linear-gradient(90deg,var(--accent),#38bdf8);padding:10px 14px;border-radius:999px;color:#042025;font-weight:700;text-decoration:none}
@media(max-width:640px){ .cert-img{width:280px} }

</style>
</head>
<body>
<header>
  <div class="header-left">
    <img src="images/profile.jpg" alt="profile">
    <div style="font-weight:800">Abdelrahman Hassan</div>
  </div>
  <nav><a href="index.html" style="color:var(--text);text-decoration:none;font-weight:700">&larr; Back to Portfolio</a></nav>
</header>

<main class="wrap">
  <h1 style="color:var(--accent);margin:6px 0">Achievements & Certificates</h1>
  <p style="color:rgba(230,238,243,0.86)">Certificates & recognitions. Click the LinkedIn button to view the post.</p>

  <div class="card" style="margin-top:16px">
    <div class="cert-wrap">
      <img src="images/iti.jpg" alt="ITI certificate" class="cert-img">
      <div style="max-width:400px">
        <h3>ITI - FullStack PHP Certificate</h3>
        <p style="color:rgba(230,238,243,0.8)">Completed 150 hours of FullStack development training focusing on PHP and Laravel.</p>
        <div class="meta">
          <div style="color:rgba(230,238,243,0.8)">Issuer: ITI</div>
          <a href="https://www.linkedin.com/posts/abdelrahman-hassan-809b3b339_webdevelopment-php-laravel-activity-7370444747905142784-XNJK" target="_blank"><i class="fa-brands fa-linkedin"></i>&nbsp;View on LinkedIn</a>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
